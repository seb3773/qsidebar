# This is the configuration file for qsidebar. Please note that some options are not available for gtk2 version.
[General settings]
# Set this to 1 if you're using Trinity desktop and want qsidebar to be integrated in it's own applet (using qsidebar_applet_kicker),
#     so you can tune his icon position on your kicker taskbar in a better way than using the "classic" systray mode.
#            * Note this will disable option use_systray value, as the classic systray is always disabled in this mode.
option_trinity_kicker_applet=0
# Set to 1 to enable tray icon.
#     * Ignored if trinity_kicker_applet option is 1
#     * Without trayicon or trinity_kicker_applet mode activated, you can still toggle panel visibility 
#         by sending SIGUSR1 signal to qsidebar process, (and reloading configuration if needed
#        with SIGHUP signal), allowing you to control it the way you want.
option_use_systray=1
# Sytray icon: default, bell or color  (no inverted mode in dark mode for 'color' systray icon.)
option_tray_icon=default
# Tint of the panel: default, dark, tde or r,g,b values   (default=230,230,230 / dark:65,65,65).
#    *  'tde' which is specific for trinity desktop will try to retrieve system background color
option_tint=default
# Opacity level for panel: value from 0.1 to 1    (1 = no transparency).
option_opacity=0.98
# You can use an image for the panel background, you have to specify here the full path of a valid .png image.
#     The image will not be resized.I f the image does not fit panel dimensions, it will be cropped. 
#     Set this to 'none' to use the classic solid color background. (default: none)
option_panel_image=none
# If you're using an image for the panel background, set this to 0 if you want the image to be drawn on a full transparent
#      background, instead of the solid color (specified in option tint; with opacity value in 'option opacity'). This can be usefull
#      if you want for exemple full transparent parts in the panel for a particular design. (default: 1)
#        * If no valid image is specified in option panel_image, this is ignored.
#           ~~ option not available in gtk2 version.
option_panel_image_solidbackground=1
# Panel opening/closing animation: slide,fade,slide+fade or none.
#      * Even with "none", you can experience a slight fade effect if your windows manager/compositor is configured
#         to apply a fade effect when windows are opening/closing. You probably can exclude qsidebar from this kind of
#         effect in your  windows manager configuration if it's annoying for you. (exclude fade for 'DOCK' type windows)
#          ~~ fade and slide+fade effects are not available in gtk2 version.
option_panel_anim_type=slide
# Set this to 1 if you want smoother opening/close effects.
option_panel_anim_ease_effect=0
# Panel title text: default ("Actions center") or your custom text.
option_panel_title=default
# Set to 1 to enable dark mode  (will use an inverted color scheme/inverted icons).
option_dark_mode=0
# Nighlight mode intensity : value from 0.1 to 1 (1 is darker).
option_nightlight_intensity=0.7
# Set to 1 to enable backlight control slider (for laptops for example).
#     (udev/sudoers explainaition...-->helper in config gui ?)
option_backlight_control=1
# Set to 1 for rounded quick actions buttons.
#         ~~ not available in gtk2 version.
option_rounded_buttons=0
# Set this to 0 if your windows manager/compositor doesn't allow transparency or if you experience
#    graphics glitches / don't want the panel to hide when you click outside it.
#         * When set to 1, it is advised to select in "option transparent type" a type of window without shadow borders
#            assigned by your windows manager/compositor to avoid an ugly transparent window border when panel is opened.
option_use_transparent_click=1
# Set this to ALL if you want the panel to close when you click anywhere outside it (except taskbar), or to DESKTOP if
#     you want the panel to close only with a click on the desktop, not on a window or any other widget.
#           * this is ignored when use_transparent_click=0
option_transparent_click_mode=ALL
# Set the type of transparent windows to use. You can select : DOCK/COMBO/UTILITY/DIALOG/MENU.
#   Only change this if you're experiencing ugly transparent window borders when the panel is opened, or behind notification popups.
#   The idea is to set this to a type of windows your windows manager/compositor doesn't assign border shadows to (default: COMBO).
#         * This apply to the transparent window used for click detection outside panel and notifications popups window background.
option_transparent_type=COMBO
# Panel bottom margin (default:0)
option_bottom_margin=0
# Notification sound: win10, win11, system, silent or full path of custom sound.
option_notif_sound=win11
# Notification number indicator in tray icon; if set to 0, the icon will only have two states:
#    at least one notification or no notification.
option_notif_number_indicator=1
# Set to 1 if you don't want icons in notifications.
option_notif_hide_icon=0
# Notification popup position: default, topright, topleft, bottomleft
option_notifs_popup_position=default
# Tint of the notification popup: r,g,b or default (default: 255,255,255)
option_notifs_popup_color=default
# Opacity level for notification popup: value from 0.1 to 1    (1 = no transparency).
option_notif_popup_opacity=1
# Notification popup timeout for low urgency type
option_notif_low_timeout=15
# Notification popup timeout for normal urgency type
option_notif_normal_timeout=25
# Fonts to use: system (will use system font) or a valid installed font name and optionnally size ( <font_name> [<size>]; example: SegoeUI 12 )
option_paneltitle_font=system
option_panel_text_font=system
option_quick_actions_font=system
option_project_font=system
option_notif_font=system


#------------------TODO
# You can set your language here, (provided the corresponding language file is present in the /usr/share/qsiebar/lang/ folder).
#       You can alter the translation as you wish, or create new translation, the filename format is lang_<xx> where <xx> are your language.
#       Language files are simple text files, with an easy to understand format.
option_language=en



[Quick action buttons]
# You can define up to 16 buttons.
# A button is defined by:
#     - button_x_name: the name of the button 
#     - button_x_icon: the icon of the button 
#           * if the icon is not located in the system path or qsidebar icons path (/usr/share/qsidebar/icons), you have to use his full path.
#     - button_x_type : the type of button: oneshot or toggle.
#     - button_x_cmd : the associated action, =<script or program to execute>
#             . it can be a shell script or a program. If it's not located in the system path or qsidebar scripts path (/usr/share/qsidebar/scripts),
#                you will need to use the full path. If it's a shell script, don't forget to specify "sh" or "bash' before script name.
#     - button_x_initstate_cmd: if it's a toggle button, you have to provide an additionnal action for checking current state (should return 0 or 1) =<script or program to execute>
#     - button_x_icon_only : If you only want the icon to be displayed in the button, the name will be displayed in a tooltip.
#         *  - button_x_confirm_cmd: 0 or 1 ; Valid for oneshot buttons type only, if set to 1 it will display a confirmation window before executing button_x_cmd
#         *  - button_x_confirm_text: Text that will be displayed in confirmation window
#
#  There are "predefined" buttons you can use: {wifi} , {bluetooth} , {airplane} , {nightlight} , {project} or {focus}
#      For this buttons, you only need to provide an icon, either use one of those in /usr/share/qsidebar/icons or your own.
#      The actions to execute and state checking are done internally, and should (hopefully) works for most configurations.
#      In the case it doesn't work properly for you or doesn't suit your needs, create your own toggle buttons, it's easy ;)
#             * In the special case of {project} predefined button, which open a new panel to select your dual display configuration mode,
#               you can use this panel with your own actions if you prefer to. See [Project custom actions] section.
button_1_name={wifi}
button_1_icon=wifi.png

button_2_name={nightlight}
button_2_icon=darkmode.png

button_3_name=Network
button_3_type=oneshot
button_3_icon=network.png
button_3_cmd=sh /usr/share/qsidebar/scripts/network.sh

button_4_name={focus}
button_4_icon=focus.png

button_5_name=Snapshot
button_5_type=oneshot
button_5_icon=snapshot.png
button_5_cmd=ksnapshot

button_6_name={airplane}
button_6_icon=airplane.png

button_7_name=All Settings
button_7_type=oneshot
button_7_icon=settings.png
button_7_cmd=kcontrol

button_8_name=Note
button_8_type=oneshot
button_8_icon=note.png
button_8_cmd=sh /usr/share/qsidebar/scripts/knotes.sh
button_8_confirm_cmd=1
button_8_confirm_text=Do you want to create a new note ?


button_9_name={bluetooth}
button_9_icon=bt.png

button_10_name={project}
button_10_icon=project.png


[Project settings]
# If your taskbar isn't configured to be visible on the second screen in extend mode (or if you don't use a taskbar), 
#    set this to 1 to use full screen height for the panel in this dual display mode.
project_extend_full_panel_height=1
# If you want to use external script(s)/program(s) to configure some or all display modes.
#     (leave empty to use internal functions)
action_pc_screen_only=
action_duplicate=
action_extend=
action_second_screen_only=


[Notifications filters]
# You can definie here filters for received notifications, up to 20 filters are allowed.
# Filter type can be "title", "body", "title+body" or "app_name", this is required.
# Filter string is the string to search in filter type selected, this is required.
# Filter action can be "ignore", "accept_but_silent" or "set_urgent". Can be combined with filter exec.
# Filter exec is a command you want to execute when the filter is triggered. Can be combined with filter action.
#       *At least Filter action or Filter exec must be specified, if none is found, filter is invalid and ignored.
notif_filter_1_type=body
notif_filter_1_string=charge
notif_filter_1_action=accept_but_silent
notif_filter_1_exec=

notif_filter_2_type=
notif_filter_2_string=
notif_filter_2_action=
notif_filter_2_exec=

